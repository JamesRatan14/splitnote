name: AI server tests

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (fake Claude, no API key, no cost)
        run: python -m pytest -q tests
